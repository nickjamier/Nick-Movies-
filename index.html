<!DOCTYPE html>

<style>

header{

button{

.popup{

left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
background:#111;
padding:30px;

}

iframe{
width:90%;

margin-top:20px;

<body>

🎬 NICK HOUSE OF MOVIES
</header>

<div class="movie">
<h2>Last Samurai Standing</h2>

<button onclick="openPayment()">Play Movie</button>

</div>

<div class="popup" id="paymentPopup">
<div class="popup-box">

<h2>Payment Required</h2>
<p>Send <b>500 UGX</b> to:</p>
<p style="font-size:20px;"><b>0748536581</b></p>

<button onclick="confirmPayment()">I HAVE PAID</button>
<br><br>
<button onclick="closePopup()">Cancel</button>

</div>
</div>

<iframe id="movieFrame"
src=""
allow="autoplay"
allowfullscreen>
</iframe>

<script>

let movieLink="https://drive.google.com/file/d/17IVQrQlt6nPgZ8WRo0K7pL8EoPajqdGR/preview";

function openPayment(){
document.getElementById("paymentPopup").style.display="flex";
}

function closePopup(){
document.getElementById("paymentPopup").style.display="none";
}

function confirmPayment(){
document.getElementById("paymentPopup").style.display="none";
document.getElementById("movieFrame").style.display="block";
document.getElementById("movieFrame").src=movieLink;
}

</script>

</body>
